# Lake workspace of the Ed25519 release asset. It compiles the shared sources in ../../lean
# against this asset's artifacts: one module per build, artifact/M0Crypto/Artifacts/Ed25519Compact.lean
# and Ed25519Fast.lean, generated by tools/extract_release.py from the library's
# m0crypto_ed25519_compact.o and m0crypto_ed25519_fast.o. The shared slot M0Crypto.Artifacts.Release
# is empty here (artifact/M0Crypto/Artifacts/Release.lean). It builds only the asset root
# M0Crypto.Assets.Ed25519 and its imports.
name = "m0crypto_ed25519"
version = "0.4.0"
defaultTargets = ["Asset"]

# Makes every module under ../../lean local to this workspace (built here, not looked up).
[[lean_lib]]
name = "M0Crypto"
leanOptions = { warningAsError = true }
srcDir = "../../lean"
globs = ["M0Crypto.+"]

# Lake takes a module from the last library that matches it: the artifacts come from here.
[[lean_lib]]
name = "Artifact"
leanOptions = { warningAsError = true }
srcDir = "artifact"
roots = ["M0Crypto.Artifacts.Release", "M0Crypto.Artifacts.Ed25519Compact",
  "M0Crypto.Artifacts.Ed25519Fast"]

[[lean_lib]]
name = "Asset"
leanOptions = { warningAsError = true }
srcDir = "../../lean"
roots = ["M0Crypto.Assets.Ed25519"]

# The claims of Audit.lean as `sorry` statements over the statement files only: the challenge that
# tools/comparator.sh judges the asset root against. Not a default target.
[[lean_lib]]
name = "Challenge"
srcDir = "challenge"
roots = ["Challenge"]

# Native build of the executable checks of both builds (plan phase 5), run by tools/check.sh:
# the entries and the internal routines in the whole-function model. Not a default target.
[[lean_exe]]
name = "release_check"
leanOptions = { warningAsError = true }
srcDir = "../../lean"
root = "M0Crypto.Thumb.ReleaseCheck.Ed25519Main"
