# Lake workspace of the Blake2s release asset. It compiles the shared sources in ../../lean
# against this asset's own artifact (artifact/M0Crypto/Artifacts/Release.lean, generated by
# tools/extract_release.py from the library's m0crypto_blake2s.o) and builds only the
# asset root M0Crypto.Assets.Blake2s and its imports.
name = "m0crypto_blake2s"
version = "0.3.0"
defaultTargets = ["Asset"]

# Makes every module under ../../lean local to this workspace (built here, not looked up).
[[lean_lib]]
name = "M0Crypto"
srcDir = "../../lean"
globs = ["M0Crypto.+"]

# Lake takes a module from the last library that matches it: the artifact comes from here.
[[lean_lib]]
name = "Artifact"
srcDir = "artifact"
roots = ["M0Crypto.Artifacts.Release"]

[[lean_lib]]
name = "Asset"
srcDir = "../../lean"
roots = ["M0Crypto.Assets.Blake2s"]
