# Lake workspace of the ChaCha20Poly1305 release asset. It compiles the shared sources in ../../lean
# against this asset's own artifact (artifact/M0Crypto/Artifacts/Release.lean, generated by
# tools/extract_release.py from the library's m0crypto_chacha20poly1305.o) and builds only the
# asset root M0Crypto.Assets.ChaCha20Poly1305 and its imports.
name = "m0crypto_chacha20poly1305"
version = "0.3.0"
defaultTargets = ["Asset"]

# Makes every module under ../../lean local to this workspace (built here, not looked up).
[[lean_lib]]
name = "M0Crypto"
srcDir = "../../lean"
globs = ["M0Crypto.+"]

# Lake takes a module from the last library that matches it: the artifact comes from here.
[[lean_lib]]
name = "Artifact"
srcDir = "artifact"
roots = ["M0Crypto.Artifacts.Release"]

[[lean_lib]]
name = "Asset"
srcDir = "../../lean"
roots = ["M0Crypto.Assets.ChaCha20Poly1305"]

# Native build of the executable release checks, for the mutation script. The proofs build
# does not use it: the asset root runs the same checks in Lean's interpreter.
[[lean_exe]]
name = "release_check"
srcDir = "../../lean"
root = "M0Crypto.Thumb.ReleaseCheck.ChaCha20Poly1305Main"
